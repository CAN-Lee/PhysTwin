# Rope Specific Config
output_dir: './output_3/rope_warp'
tag: 'rope'

# [NEW] Target Scenes Filter
# If provided, only these scenes will be trained
target_scenes:
  - "single_push_rope"
  - "single_push_rope_1"
  - "single_push_rope_4"
  - "single_lift_rope"
  - "rope_double_hand"

data:
  root: './data/different_types'
  reverse_z: true
   # Gaussian filling: add new_internal (and optionally dense) to MPM init_pos when PLY exists
  gaussian_output_dir: './gaussian_output'
  gaussian_grid_n: 96            # [STABILITY] Reduced from 96 to limit total particles
  gaussian_density_thres: 0.8    
  gaussian_search_thres: 0.3     # [STABILITY] Increased to reduce internal filling noise
  gaussian_max_particles_per_cell: 3  # [STABILITY] Reduced from 3 to prevent OOM with large N


train:
  lr_params: 1e-3
  iters: 200
  batch_size: 1
  gpus: '4,6,7'
  num_workers: 2
  lambda_track: 1.0
  lambda_chamfer: 1.0
  lambda_vel: 0.1
  lambda_smooth: 0.1
  lambda_sparse: 0.05
  # Early Stopping Config
  early_stop_patience: 20 # 连续多少次没有显著改进则停止
  early_stop_min_delta: 1e-5 # 最小改进阈值

mpm:
  use_warp: true
  device: 'cuda'
  n_particles: 100000
  dt: 1e-4           # [STABILITY] Matched with Cloth3 for folding/complex interaction
  grid_res: 32       
  
  active_experts: ['nh', 'co', 'st', 'fi'] 
  
  # [NEW] Initial Expert Weights (Softmax-ready probabilities)
  init_weights: [0.4, 0.1, 0.1, 0.4]

  tape_window: 5          # Warp tape 只记录每帧最后 N 个子步骤，防止长链梯度爆炸
  grad_clip_norm: 0.1     # 物理参数(E/nu/weights等)的梯度裁剪阈值，独立于神经网络
  svd_clamp_max: 2.0
  
  floor_margin: 0.0    # push 场景绳子贴地，lift 场景可调回 0.05
  gravity: [0.0, 0.0, -9.8] 
  damping: 30.0      # [STABILITY] Significantly increased damping for sparse rope
  grid_v_damping_scale: 0.999 
  clip_bound: 0.5
  
  # Initial values for raw_params (log-space mapping)
  init_raw_params: -1.0 
  init_raw_E: 0.0         # sigmoid(0)=0.5 → E≈3.2e5 Pa (绳子 bulk 刚度中等)
  init_raw_fiber_k: 2.0   # sigmoid(2)=0.88 → fiber_k≈3.3e7 Pa (绳子沿纤维方向强抗拉)
  init_raw_yield: 0.0     # sigmoid(0)=0.5 → yield≈3.2e5 Pa (绳子不易塑性变形)
  
  material_bounds:
    E: [1e4, 1e7]        # 绳子 bulk 刚度：比布料硬，比硬橡胶软
    nu: [0.0, 0.45]      
    yield_stress: [1e4, 1e7] # 绳子不易屈服
    plastic_viscosity: [0.1, 10.0] 
    fiber_k: [1e4, 1e8]  # 纤维抗拉：绳子最重要的特性，上限高
  
  # 与 softbody 保持同一量级，防止 tape 梯度 (~1e6) 导致发散
  lr_ranges:
    E: [1e-3, 1e-5]
    nu: [1e-3, 1e-5]
    yield_stress: [1e-3, 1e-5]     
    plastic_viscosity: [1e-3, 1e-5] 
    fiber_k: [1e-3, 1e-5]      
    fiber_dir: [1e-4, 1e-6]  
    log_weights: [1e-3, 1e-5]
  
  weight_warmup_iters: 10
  fiber_warmup_iters: 0         
  
  # Simulation Loop Control
  # To match 30 FPS (0.0333s per frame): 5e-5 * 666 = 0.0333s
  # To match 30 FPS (0.0333s per frame): 1e-4 * 333 = 0.0333s
  max_frames: 300 
  steps_per_frame: 333           # [STABILITY] Doubled to match halved dt
  
  controller_stiffness: 800000.0   # [BOOSTED] High power within 1.0 dv limit to fight gravity
  controller_damping: 5000.0      # Synchronized increase
  controller_radius: 0.10         
  controller_max_neighbors: 64    
  controller_clamp_dv: 2.0         # [USER REQ] Reduced to prevent explosions
  controller_smooth_window: 2   
  controller_warmup_frames: 3
  
  # Default Boundary (Slip with Friction)
  boundary:
    type: 'surface_collider'
    point: [0.0, 0.0, 0.0]
    normal: [0.0, 0.0, 1.0]
    surface: 'slip'
    friction: 0.4       
    restitution: 0.5       
    start_time: 0.0
    end_time: 1000.0

# 4. Residual PGND Config
residual:
  mode: 'residual' # "residual", "damping", "both"
  warmup_iters: 10  # [STABILITY] Let physics parameters (E, weights) stabilize first
  # damping_interval: 333 # [STABILITY] Sync with steps_per_frame to update once per frame
  lr: 1e-2
  grad_clip_norm: 1.0   # ResidualPGND 的梯度裁剪阈值，独立于物理参数
  feature_dim: 64       # PointNet 提取的特征维度
  radius: 0.05          # [已弃用] 原 P2G 搜索半径，现已被 B-Spline 取代
  n_history: 3          # 输入网络的时间步历史长度 (H)
  grid_res_list: [32, 32, 32] # 神经场网格分辨率，应与 mpm.grid_res 一致
  pe_num_func: 6        # 位置编码 (Positional Encoding) 的频率函数数量
  num_layers: 4         # 解码器 MLP 的层数
  hidden_size: 128      # 隐藏层神经元数量
  input_scale: 1.0      # 输入特征 (速度/位移) 的缩放比例
  output_scale: 0.8     # 残差输出的最大幅值截断 (基于 tanh的输出值，再乘以output_scale) 0.3->0.5
  lambda_reg: 0.005     # 残差 L2 正则化权重，用于约束修正强度 0.005->0.001

bridge:
  enabled: true
  gaussian_root: './gaussian_output'
  gaussian_exp_name: 'auto_latest'
  inference_dir: './output_3/mpm_inference'
  num_render_anchors: 4096
  anchor_particle_k: 16
  anchor_graph_k: 8
  gaussian_anchor_k: 8
  anchor_particle_temp: 0.01
  max_pos_residual: 0.005
  max_opacity_delta: 0.5
  residual_hidden_size: 128
  residual_layers: 3
  stage1_global_optimization: true
  stage1_shuffle_train_samples: true
  stage1_val_max_samples: 0
  stage1_iters: 50
  stage2_iters: 20
  stage1_lr_static: 1e-3
  stage1_lr_residual: 1e-3
  stage2_lr: 1e-4
  stage1_grad_clip_norm: 1.0
  joint_warmup_iters: 10
  render_frame_stride: 10
  lambda_dssim: 0.2
  lambda_rgb: 1.0
  lambda_mask: 0.5
  lambda_bind: 1e-4
  lambda_weight_sparse: 1e-4
  lambda_res_pos: 1e-4
  lambda_res_opacity: 1e-4
  lambda_res_temporal: 1e-4
  lambda_render_joint: 0.05
  eval_every: 5
