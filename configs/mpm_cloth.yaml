# Output settings
output_dir: './output_3/cloth'
tag: 'cloth_lift_moe'

# [NEW] Target Scenes Filter
# If provided, only these scenes will be trained
target_scenes: 
  - "double_lift_cloth_1"
  # - "single_clift_cloth_1"
  # - "single_clift_cloth_3"

# Data Config
data:
  root: './data/different_types' # Point to real data root
  reverse_z: true                # Flip Z axis to match physical gravity and boundary
  

  # 2. Optimization Config
train:
  lr_params: 1e-3    # 2e-4 [STABILITY] Further reduced to prevent over-shooting good parameters
  iters: 50          # [INCREASED] Since we have early stopping now
  batch_size: 1
  gpus: '4'
  num_workers: 1
  lambda_track: 1.0
  lambda_chamfer: 1.0
  lambda_vel: 0.1
  lambda_smooth: 0.1
  lambda_sparse: 0.05  # Slightly higher sparsity for cloth (distinct fiber/elastic regions)
  # Early Stopping Config
  early_stop_patience: 10 # 连续多少次没有显著改进则停止
  early_stop_min_delta: 1e-4 # 最小改进阈值

# 3. MPM Simulation Config
mpm:
  device: 'cuda'
  n_particles: 5000 
  dt: 1e-4           # [RESTORED] Original time step
  grid_res: 32       
  
  # Control active constitutive models: nh, co, st, fi
  active_experts: ['nh', 'co', 'st', 'fi'] 
  
  # [NEW] Initial Expert Weights (Softmax-ready probabilities)
  init_weights: [0.3, 0.1, 0.1, 0.5]

  # [NEW] SVD Clamping Upper Bound
  svd_clamp_max: 4.0 # [STABILITY] Balanced between 3.0 and 5.0
  
  gravity: [0.0, 0.0, -9.8] 
  damping: 10.0       # [BALANCED] 5.0 might be too slippery
  grid_v_damping_scale: 0.999 
  clip_bound: 0.5
  
  # Initial values for raw_params (log-space mapping)
  init_raw_params: -1.0 
  init_raw_E: -1.0       # [FIRM START] Ensures force propagates from corners to center
  init_raw_fiber_k: 1.0  
  init_raw_yield: 0.0    
  
  # Material Parameter Optimization Bounds
  material_bounds:
    E: [2e4, 1e8]       # [SOFTEN] Reduced floor from 5e4 to 1e4 to allow more bending
    nu: [0.0, 0.45]     
    yield_stress: [2e5, 1e8] # [SOFTEN] Reduced floor from 5e5 to 1e5
    plastic_viscosity: [0.1, 10.0] 
    fiber_k: [2e5, 1e9] # [SOFTEN] Reduced floor from 5e5 to 1e5 to allow extension/bending 
  
  # Parameter-level Learning Rate Ranges [start, end]
  lr_ranges:
    E: [0.1, 0.001]
    nu: [0.1, 0.001]
    yield_stress: [0.01, 0.0001]     
    plastic_viscosity: [0.01, 0.0001] 
    fiber_k: [0.01, 0.0001]      
    fiber_dir: [0.001, 0.00001]  
    log_weights: [1e-3, 1e-5]
  
  # [NEW] Staged Optimization
  weight_warmup_iters: 10
  fiber_warmup_iters: 0         
  
  # Simulation Loop Control
  # To match 30 FPS (0.0333s per frame): 1e-4 * 333 = 0.0333s
  max_frames: 300 
  steps_per_frame: 333 
  
  # Controller Interaction Config (Target Acceleration Mode)
  controller_stiffness: 150000.0   # [REVISED] Increased to compensate for fewer particles
  controller_damping: 5000.0       
  controller_radius: 0.10          # [PRECISION] Reduced to only grab corners, not the center
  controller_max_neighbors: 128    # [REVISED] 
  controller_clamp_dv: 2.0         # Max velocity change per step
  controller_smooth_window: 2   
  controller_warmup_frames: 3
  
  # Default Boundary (Slip with Friction)
  boundary:
    type: 'surface_collider'
    point: [0.0, 0.0, 0.0]
    normal: [0.0, 0.0, 1.0]
    surface: 'slip'
    friction: 0.1       # [REDUCED] 
    restitution: 0.5    
    start_time: 0.0
    end_time: 1000.0

# 4. Residual PGND Config
residual:
  lr: 5e-4              # 残差网络的学习率 
  feature_dim: 64       # PointNet 提取的特征维度
  radius: 0.05          # [已弃用] 原 P2G 搜索半径，现已被 B-Spline 取代
  n_history: 3          # 输入网络的时间步历史长度 (H)
  grid_res_list: [32, 32, 32] # 神经场网格分辨率，应与 mpm.grid_res 一致
  pe_num_func: 6        # 位置编码 (Positional Encoding) 的频率函数数量
  num_layers: 4         # 解码器 MLP 的层数
  hidden_size: 128      # 隐藏层神经元数量
  input_scale: 1.0      # 输入特征 (速度/位移) 的缩放比例
  output_scale: 0.5     # 残差输出的最大幅值截断 (基于 tanh的输出值，再乘以output_scale) 0.3->0.5
  lambda_reg: 0.001     # 残差 L2 正则化权重，用于约束修正强度 0.005->0.001
